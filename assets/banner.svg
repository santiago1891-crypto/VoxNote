<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">VoxNote — Transcripción local y resumen con IA</title>
  <desc id="desc">Banner de VoxNote: de una grabación a notas claras. Whisper en tu equipo, TXT y SRT, informe en PDF con Gemini solo cuando tú lo pides.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A14"/>
      <stop offset="0.55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#130B26"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow-violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#dots)"/>
  <circle cx="1010" cy="20" r="250" fill="url(#glow-violet)"/>
  <circle cx="110" cy="310" r="230" fill="url(#glow-cyan)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>

  <!-- Marca -->
  <g transform="translate(64, 52)">
    <rect width="62" height="62" rx="18" fill="url(#brand)"/>
    <rect x="0.5" y="0.5" width="61" height="61" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.28"/>
    <g stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" opacity="0.95">
      <path d="M13 32v-3"/>
      <path d="M21 40V24"/>
      <path d="M30 48V14"/>
      <path d="M39 40V24"/>
      <path d="M47 35v-6"/>
    </g>
  </g>

  <text x="146" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#FFFFFF">VoxNote</text>
  <text x="148" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.6" fill="#8FA0C0">TRANSCRIPCIÓN LOCAL · RESUMEN CON IA</text>

  <text x="64" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#E6EAF7">De una grabación a <tspan fill="#C4B5FD">notas claras</tspan>.</text>
  <text x="64" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#8592B0">Whisper corre en tu equipo; Gemini solo recibe el texto cuando tú lo pides.</text>

  <!-- Pastillas -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="64" y="242" width="112" height="30" rx="15" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.32"/>
    <circle cx="82" cy="257" r="3.2" fill="#34D399"/>
    <text x="92" y="261.5" fill="#A7F3D0">100% local</text>

    <rect x="186" y="242" width="106" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.36"/>
    <text x="204" y="261.5" fill="#DDD3FF">TXT + SRT</text>

    <rect x="302" y="242" width="76" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.36"/>
    <text x="321" y="261.5" fill="#DDD3FF">PDF</text>

    <rect x="388" y="242" width="164" height="30" rx="15" fill="#22D3EE" fill-opacity="0.09" stroke="#22D3EE" stroke-opacity="0.30"/>
    <text x="405" y="261.5" fill="#A5F3FC">Gemini opcional</text>
  </g>

  <!-- Tarjeta de flujo -->
  <g>
    <rect x="760" y="48" width="376" height="224" rx="20" fill="#04060D" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="786" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#97A5C4">FLUJO DE TRABAJO</text>

    <g fill="url(#wave)">
      <rect x="786" y="182" width="8" height="14" rx="4"/>
      <rect x="802" y="170" width="8" height="26" rx="4"/>
      <rect x="818" y="156" width="8" height="40" rx="4"/>
      <rect x="834" y="174" width="8" height="22" rx="4"/>
      <rect x="850" y="146" width="8" height="50" rx="4"/>
      <rect x="866" y="162" width="8" height="34" rx="4"/>
      <rect x="882" y="134" width="8" height="62" rx="4"/>
      <rect x="898" y="152" width="8" height="44" rx="4"/>
      <rect x="914" y="122" width="8" height="74" rx="4"/>
      <rect x="930" y="142" width="8" height="54" rx="4"/>
      <rect x="946" y="108" width="8" height="88" rx="4"/>
      <rect x="962" y="130" width="8" height="66" rx="4"/>
      <rect x="978" y="118" width="8" height="78" rx="4"/>
      <rect x="994" y="138" width="8" height="58" rx="4"/>
      <rect x="1010" y="126" width="8" height="70" rx="4"/>
      <rect x="1026" y="148" width="8" height="48" rx="4"/>
      <rect x="1042" y="136" width="8" height="60" rx="4"/>
      <rect x="1058" y="160" width="8" height="36" rx="4"/>
      <rect x="1074" y="150" width="8" height="46" rx="4"/>
      <rect x="1090" y="172" width="8" height="24" rx="4"/>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#7C8AA8">
      <text x="786" y="216">audio</text>
      <text x="924" y="216">texto</text>
      <text x="1080" y="216">pdf</text>
      <path d="M786 228h312" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
      <text x="786" y="250" font-size="11" fill="#64748B">faster-whisper · CPU int8</text>
      <text x="1006" y="250" font-size="11" fill="#64748B">Gemini · opcional</text>
    </g>
  </g>
</svg>
